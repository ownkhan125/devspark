<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Devspark · Feed 02 · 3D Prism</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0B0B10;
    --bone: #F4EFE6;
    --ember: #FF5A1F;
    --iris: #7C5CFF;
    --lime: #C7FF3D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #06060a; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Inter Tight", system-ui, sans-serif;
    color: var(--bone);
    padding: 40px;
  }
  .post {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    border-radius: 8px;
    background: radial-gradient(110% 80% at 50% 40%, #1f1d3a 0%, #0c0b16 55%, #050509 100%);
    box-shadow: 0 80px 200px -40px rgba(0,0,0,0.8);
  }
  .grain::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.09;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.9'/></svg>");
  }
  .halo {
    position: absolute;
    left: 50%;
    top: 48%;
    width: 760px;
    height: 760px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,92,255,0.55), transparent 65%);
    filter: blur(40px);
  }
  .halo-2 {
    position: absolute;
    left: 50%;
    top: 48%;
    width: 380px;
    height: 380px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,90,31,0.6), transparent 60%);
    filter: blur(60px);
  }
  .ring {
    position: absolute;
    left: 50%;
    top: 48%;
    width: 680px;
    height: 680px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px dashed rgba(244,239,230,0.15);
  }
  .ring.r2 { width: 520px; height: 520px; border-style: solid; }
  .ring.r3 { width: 880px; height: 880px; opacity: 0.6; }

  .scene {
    position: absolute;
    left: 50%;
    top: 48%;
    transform: translate(-50%, -50%);
    perspective: 1400px;
  }
  .prism {
    width: 360px;
    height: 360px;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(-18deg) rotateY(28deg) rotateZ(8deg);
  }
  .face {
    position: absolute;
    inset: 0;
    border-radius: 24px;
    background: linear-gradient(140deg, rgba(244,239,230,0.95), rgba(244,239,230,0.55) 35%, rgba(124,92,255,0.85) 75%, rgba(255,90,31,0.95));
    box-shadow:
      inset 0 0 80px rgba(255,255,255,0.35),
      inset 0 0 0 1px rgba(255,255,255,0.5),
      0 80px 140px rgba(124,92,255,0.55),
      0 30px 80px rgba(255,90,31,0.35);
  }
  .face.f2 {
    transform: translateZ(180px);
    background: linear-gradient(140deg, rgba(255,255,255,0.85), rgba(199,255,61,0.4) 60%, rgba(124,92,255,0.7));
    opacity: 0.95;
  }
  .face.f3 {
    transform: translateZ(-180px);
    background: linear-gradient(140deg, rgba(11,11,16,0.6), rgba(124,92,255,0.5));
    opacity: 0.85;
  }
  .face.fb {
    transform: rotateY(90deg) translateZ(180px);
    background: linear-gradient(150deg, rgba(255,90,31,0.95), rgba(124,92,255,0.85));
    opacity: 0.95;
  }
  .face.fl {
    transform: rotateY(-90deg) translateZ(180px);
    background: linear-gradient(150deg, rgba(244,239,230,0.9), rgba(199,255,61,0.4));
    opacity: 0.9;
  }
  .face.ft {
    transform: rotateX(90deg) translateZ(180px);
    background: linear-gradient(150deg, rgba(244,239,230,0.95), rgba(124,92,255,0.7));
    opacity: 0.95;
  }
  .face.fbo {
    transform: rotateX(-90deg) translateZ(180px);
    background: linear-gradient(150deg, rgba(11,11,16,0.6), rgba(255,90,31,0.5));
    opacity: 0.8;
  }

  .floor-glow {
    position: absolute;
    left: 50%;
    bottom: 220px;
    width: 560px;
    height: 110px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(255,90,31,0.55), transparent 75%);
    filter: blur(40px);
  }

  .reflection {
    position: absolute;
    left: 50%;
    bottom: 180px;
    width: 360px;
    height: 200px;
    transform: translateX(-50%) scaleY(-1);
    opacity: 0.18;
    mask-image: linear-gradient(to bottom, black, transparent 80%);
  }

  .top-bar {
    position: absolute;
    top: 64px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.6);
  }
  .swatch-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .swatch {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }
  .s1 { background: var(--ember); box-shadow: 0 0 12px var(--ember); }
  .s2 { background: var(--iris); box-shadow: 0 0 12px var(--iris); }
  .s3 { background: var(--lime); box-shadow: 0 0 12px var(--lime); }

  .bottom {
    position: absolute;
    left: 64px;
    right: 64px;
    bottom: 64px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: end;
    gap: 32px;
  }
  .index-num {
    font-family: "Inter Tight", sans-serif;
    font-weight: 500;
    font-size: 200px;
    line-height: 0.85;
    letter-spacing: -0.06em;
    color: var(--bone);
    display: flex;
    align-items: flex-end;
    gap: 18px;
  }
  .index-num em {
    font-style: italic;
    font-weight: 400;
    color: var(--ember);
    font-size: 80px;
    margin-bottom: 22px;
  }
  .caption {
    text-align: right;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.5);
    line-height: 1.8;
    max-width: 280px;
  }
  .caption strong {
    color: var(--bone);
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="post grain">
    <div class="halo"></div>
    <div class="halo-2"></div>
    <div class="ring r3"></div>
    <div class="ring"></div>
    <div class="ring r2"></div>

    <div class="floor-glow"></div>

    <div class="scene">
      <div class="prism">
        <div class="face f3"></div>
        <div class="face fbo"></div>
        <div class="face fl"></div>
        <div class="face fb"></div>
        <div class="face ft"></div>
        <div class="face f2"></div>
        <div class="face"></div>
      </div>
    </div>

    <div class="top-bar">
      <span>/ 02 — Object of Craft</span>
      <span class="swatch-row">
        <span class="swatch s1"></span>
        <span class="swatch s2"></span>
        <span class="swatch s3"></span>
      </span>
    </div>

    <div class="bottom">
      <div class="index-num">02<em>/10</em></div>
      <div class="caption">
        <strong>Lorem ipsum.</strong><br />
        Dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor.
      </div>
    </div>
  </div>
</body>
</html>
