<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Devspark · Feed 06 · Iris Color Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0B0B10;
    --bone: #F4EFE6;
    --ember: #FF5A1F;
    --iris: #7C5CFF;
    --lime: #C7FF3D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #06060a; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Inter Tight", sans-serif;
    color: var(--bone);
    padding: 40px;
  }
  .post {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    border-radius: 8px;
    background:
      radial-gradient(80% 60% at 70% 30%, rgba(159,134,255,1), transparent 65%),
      radial-gradient(60% 40% at 20% 80%, rgba(255,90,31,0.55), transparent 65%),
      linear-gradient(160deg, #5E3CF0 0%, #3a26a3 60%, #1A0E5B 100%);
    box-shadow: 0 80px 200px -40px rgba(0,0,0,0.8);
  }
  .grain::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.12;
    mix-blend-mode: overlay;
    z-index: 50;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.9'/></svg>");
  }

  .sphere {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .sphere.s1 {
    width: 280px; height: 280px;
    right: 80px; top: 110px;
    background: radial-gradient(circle at 30% 30%, #ffd8c4, #ff7a45 40%, #FF5A1F 70%, #7C2A05 100%);
    box-shadow:
      inset -30px -40px 60px rgba(0,0,0,0.45),
      inset 20px 30px 60px rgba(255,255,255,0.25),
      0 50px 80px rgba(255,90,31,0.45);
  }
  .sphere.s2 {
    width: 160px; height: 160px;
    left: 110px; top: 240px;
    background: radial-gradient(circle at 30% 30%, #fffce8, #C7FF3D 50%, #8ab51e 100%);
    box-shadow:
      inset -20px -30px 40px rgba(0,0,0,0.35),
      inset 15px 20px 40px rgba(255,255,255,0.3),
      0 30px 50px rgba(199,255,61,0.4);
  }
  .sphere.s3 {
    width: 220px; height: 220px;
    right: 180px; bottom: 200px;
    background: radial-gradient(circle at 30% 30%, #fff, #c9c0ae 50%, #7d6f4f 100%);
    box-shadow:
      inset -25px -35px 50px rgba(0,0,0,0.4),
      inset 18px 25px 45px rgba(255,255,255,0.4),
      0 40px 70px rgba(0,0,0,0.5);
  }

  .ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 760px;
    height: 760px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(244,239,230,0.18);
  }
  .ring.r2 { width: 940px; height: 940px; opacity: 0.4; }

  .card {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 620px;
    padding: 56px 48px;
    border-radius: 28px;
    border: 1px solid rgba(244,239,230,0.20);
    background: linear-gradient(180deg, rgba(244,239,230,0.10), rgba(244,239,230,0.04));
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.18),
      0 40px 100px rgba(0,0,0,0.45);
    text-align: center;
  }
  .card .mono {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.75);
  }
  .card .h {
    margin-top: 22px;
    font-weight: 500;
    font-size: 96px;
    line-height: 0.92;
    letter-spacing: -0.045em;
    color: var(--bone);
    text-wrap: balance;
  }
  .card .h em {
    font-style: italic;
    font-weight: 400;
    color: #ffd8c4;
  }
  .card .desc {
    margin-top: 24px;
    font-size: 16px;
    line-height: 1.55;
    color: rgba(244,239,230,0.85);
    max-width: 420px;
    margin-left: auto; margin-right: auto;
  }
  .card .cta {
    margin-top: 32px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 26px;
    border-radius: 999px;
    background: var(--bone);
    color: var(--ink);
    font-family: "Inter Tight", sans-serif;
    font-weight: 500;
    font-size: 14px;
  }

  .top-bar {
    position: absolute;
    top: 56px; left: 56px; right: 56px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.7);
    z-index: 4;
  }

  .bottom-bar {
    position: absolute;
    left: 56px; right: 56px; bottom: 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.6);
    z-index: 4;
  }
  .barcode {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 26px;
  }
  .barcode i {
    width: 2px;
    background: rgba(244,239,230,0.7);
    display: inline-block;
  }
</style>
</head>
<body>
  <div class="post grain">
    <div class="sphere s1"></div>
    <div class="sphere s2"></div>
    <div class="sphere s3"></div>
    <div class="ring r2"></div>
    <div class="ring"></div>

    <div class="top-bar">
      <span>/ 06 — Color Field</span>
      <span>VOL · 01 · MMXXVI</span>
    </div>

    <div class="card">
      <div class="mono">/ Lorem ipsum dolor</div>
      <div class="h">Sit <em>amet</em> consectetur adipiscing.</div>
      <div class="desc">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore.</div>
      <div class="cta">Lorem ipsum →</div>
    </div>

    <div class="bottom-bar">
      <span class="barcode">
        <i style="height:22px"></i><i style="height:18px"></i><i style="height:26px"></i><i style="height:14px"></i><i style="height:24px"></i><i style="height:20px"></i><i style="height:26px"></i><i style="height:16px"></i><i style="height:22px"></i><i style="height:26px"></i><i style="height:18px"></i><i style="height:24px"></i><i style="height:14px"></i><i style="height:26px"></i><i style="height:20px"></i><i style="height:22px"></i>
      </span>
      <span>Devspark.studio / 06.10</span>
    </div>
  </div>
</body>
</html>
