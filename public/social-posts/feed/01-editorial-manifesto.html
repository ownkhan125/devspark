<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Devspark · Feed 01 · Editorial Manifesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0B0B10;
    --ink-800: #13121B;
    --ink-700: #1A1822;
    --bone: #F4EFE6;
    --bone-soft: #C9C0AE;
    --ember: #FF5A1F;
    --iris: #7C5CFF;
    --lime: #C7FF3D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #06060a; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Inter Tight", system-ui, sans-serif;
    color: var(--bone);
    padding: 40px;
  }
  .post {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    border-radius: 8px;
    background:
      radial-gradient(120% 90% at 20% 10%, rgba(124,92,255,0.35), transparent 55%),
      radial-gradient(90% 70% at 100% 100%, rgba(255,90,31,0.30), transparent 55%),
      radial-gradient(60% 50% at 50% 70%, rgba(199,255,61,0.10), transparent 65%),
      linear-gradient(160deg, #0B0B10 0%, #13121B 50%, #0B0B10 100%);
    box-shadow: 0 80px 200px -40px rgba(0,0,0,0.8);
  }
  .grain::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.10;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.9'/></svg>");
  }
  .grid-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(244,239,230,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(244,239,230,0.04) 1px, transparent 1px);
    background-size: 90px 90px;
    mask-image: radial-gradient(120% 80% at 50% 50%, black 35%, transparent 90%);
  }
  .orb {
    position: absolute;
    border-radius: 999px;
    filter: blur(120px);
    pointer-events: none;
  }
  .orb-1 { width: 620px; height: 620px; left: -180px; top: -180px; background: rgba(124,92,255,0.55); }
  .orb-2 { width: 540px; height: 540px; right: -160px; bottom: -160px; background: rgba(255,90,31,0.45); }
  .orb-3 { width: 280px; height: 280px; left: 60%; top: 65%; background: rgba(199,255,61,0.18); }

  .frame {
    position: absolute;
    inset: 48px;
    border: 1px solid rgba(244,239,230,0.10);
    border-radius: 4px;
    pointer-events: none;
  }
  .corner {
    position: absolute;
    width: 18px;
    height: 18px;
    border: 1px solid rgba(244,239,230,0.45);
  }
  .corner.tl { left: -1px; top: -1px; border-right: none; border-bottom: none; }
  .corner.tr { right: -1px; top: -1px; border-left: none; border-bottom: none; }
  .corner.bl { left: -1px; bottom: -1px; border-right: none; border-top: none; }
  .corner.br { right: -1px; bottom: -1px; border-left: none; border-top: none; }

  .top-bar {
    position: absolute;
    top: 90px;
    left: 90px;
    right: 90px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.55);
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    border: 1px solid rgba(244,239,230,0.15);
    border-radius: 999px;
    backdrop-filter: blur(8px);
    background: rgba(11,11,16,0.4);
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--lime);
    box-shadow: 0 0 16px var(--lime);
  }

  .stage {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    perspective: 1400px;
  }
  .title {
    position: relative;
    text-align: center;
    font-weight: 500;
    font-size: 130px;
    line-height: 0.92;
    letter-spacing: -0.045em;
    text-wrap: balance;
    transform-style: preserve-3d;
  }
  .title .row {
    display: block;
  }
  .title em {
    font-style: italic;
    font-weight: 400;
    color: var(--ember);
    position: relative;
  }
  .title em::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    bottom: 6px;
    height: 4px;
    background: var(--ember);
    transform: skewX(-12deg);
    box-shadow: 0 0 30px rgba(255,90,31,0.7);
  }
  .ghost {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: "Inter Tight", sans-serif;
    font-weight: 500;
    font-size: 480px;
    color: rgba(244,239,230,0.025);
    letter-spacing: -0.06em;
    z-index: 0;
    pointer-events: none;
    font-style: italic;
  }

  .bottom-bar {
    position: absolute;
    bottom: 90px;
    left: 90px;
    right: 90px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 32px;
    align-items: end;
  }
  .lede {
    max-width: 320px;
    font-family: "Inter Tight", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    color: rgba(244,239,230,0.66);
    text-wrap: pretty;
  }
  .monogram {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    border: 1px solid rgba(244,239,230,0.25);
    display: grid;
    place-items: center;
    font-family: "Inter Tight", sans-serif;
    font-weight: 600;
    font-size: 24px;
    letter-spacing: -0.04em;
    background: rgba(11,11,16,0.6);
    backdrop-filter: blur(10px);
    box-shadow:
      0 0 0 1px rgba(244,239,230,0.05),
      0 20px 60px -10px rgba(124,92,255,0.4),
      inset 0 0 30px rgba(124,92,255,0.15);
  }
  .meta {
    justify-self: end;
    text-align: right;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.45);
    line-height: 1.8;
  }
  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(120% 100% at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%);
  }
</style>
</head>
<body>
  <div class="post grain">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
    <div class="ghost">d</div>

    <div class="frame">
      <span class="corner tl"></span>
      <span class="corner tr"></span>
      <span class="corner bl"></span>
      <span class="corner br"></span>
    </div>

    <div class="top-bar">
      <span class="pill"><span class="dot"></span>Available · Lorem MMXXVI</span>
      <span>Vol. 01 / Edit. 04</span>
    </div>

    <div class="stage">
      <h1 class="title">
        <span class="row">Lorem ipsum</span>
        <span class="row">dolor sit <em>amet</em>,</span>
        <span class="row">consectetur.</span>
      </h1>
    </div>

    <div class="bottom-bar">
      <p class="lede">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
      <div class="monogram">DS</div>
      <div class="meta">
        / 01 — Manifesto<br />
        Devspark Studio<br />
        Lorem · Ipsum · Dolor
      </div>
    </div>

    <div class="vignette"></div>
  </div>
</body>
</html>
