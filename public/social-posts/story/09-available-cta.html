<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Devspark · Story 09 · Available CTA</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0B0B10;
    --bone: #F4EFE6;
    --ember: #FF5A1F;
    --iris: #7C5CFF;
    --lime: #C7FF3D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #06060a; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Inter Tight", sans-serif;
    color: var(--bone);
    padding: 30px;
  }
  .story {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    border-radius: 8px;
    background:
      radial-gradient(60% 30% at 50% 100%, rgba(199,255,61,0.25), transparent 60%),
      radial-gradient(60% 40% at 80% 20%, rgba(124,92,255,0.30), transparent 60%),
      linear-gradient(180deg, #0B0B10 0%, #0F0E18 100%);
    box-shadow: 0 80px 200px -40px rgba(0,0,0,0.8);
  }
  .grain::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.10;
    mix-blend-mode: overlay;
    z-index: 50;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.9'/></svg>");
  }

  .grid-bg {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(244,239,230,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(244,239,230,0.04) 1px, transparent 1px);
    background-size: 100px 100px;
    mask-image: radial-gradient(60% 60% at 50% 50%, black, transparent 90%);
  }

  .top {
    position: absolute;
    top: 110px;
    left: 100px;
    right: 100px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 16px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.55);
    z-index: 10;
  }

  .availability {
    position: absolute;
    top: 300px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 18px;
    padding: 20px 32px;
    border-radius: 999px;
    border: 1px solid rgba(199,255,61,0.45);
    background: rgba(11,11,16,0.5);
    backdrop-filter: blur(12px);
    font-family: "JetBrains Mono", monospace;
    font-size: 18px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--bone);
    box-shadow: 0 30px 60px rgba(199,255,61,0.25), inset 0 1px 0 rgba(255,255,255,0.10);
  }
  .availability .dot-wrap {
    position: relative;
    display: inline-grid;
    place-items: center;
    width: 18px;
    height: 18px;
  }
  .availability .dot-wrap::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: rgba(199,255,61,0.4);
    animation: pulse 1.6s ease-out infinite;
  }
  .availability .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--lime);
    box-shadow: 0 0 20px var(--lime);
  }
  @keyframes pulse {
    0% { transform: scale(0.6); opacity: 0.8; }
    100% { transform: scale(2.2); opacity: 0; }
  }

  .center {
    position: absolute;
    left: 100px;
    right: 100px;
    top: 480px;
    text-align: center;
    z-index: 10;
  }
  .center .small {
    font-family: "JetBrains Mono", monospace;
    font-size: 16px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.55);
    margin-bottom: 36px;
  }
  .center h1 {
    font-weight: 500;
    font-size: 180px;
    line-height: 0.92;
    letter-spacing: -0.05em;
    text-wrap: balance;
  }
  .center h1 em {
    font-style: italic;
    font-weight: 400;
    color: var(--ember);
    position: relative;
  }
  .center h1 em::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    bottom: 10px;
    height: 8px;
    background: var(--ember);
    transform: skewX(-12deg);
    opacity: 0.85;
    box-shadow: 0 0 30px rgba(255,90,31,0.7);
  }
  .center .lede {
    margin-top: 40px;
    font-size: 28px;
    line-height: 1.45;
    color: rgba(244,239,230,0.75);
    max-width: 720px;
    margin-left: auto; margin-right: auto;
  }

  .cta-stack {
    position: absolute;
    left: 100px;
    right: 100px;
    bottom: 280px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    padding: 26px 50px;
    border-radius: 999px;
    font-weight: 500;
    font-size: 30px;
    letter-spacing: -0.02em;
    background: var(--ember);
    color: var(--ink);
    box-shadow:
      0 30px 80px rgba(255,90,31,0.55),
      inset 0 1px 0 rgba(255,255,255,0.35);
  }
  .cta .a {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--bone);
    display: grid;
    place-items: center;
  }
  .cta .a svg { width: 22px; height: 22px; }
  .cta-2 {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 20px 36px;
    border-radius: 999px;
    border: 1px solid rgba(244,239,230,0.3);
    color: var(--bone);
    font-family: "JetBrains Mono", monospace;
    font-size: 16px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    backdrop-filter: blur(8px);
    background: rgba(11,11,16,0.4);
  }

  .bottom {
    position: absolute;
    left: 100px;
    right: 100px;
    bottom: 110px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.55);
    z-index: 10;
  }
  .bottom .l {
    font-family: "Inter Tight", sans-serif;
    font-weight: 600;
    font-size: 36px;
    letter-spacing: -0.035em;
    color: var(--bone);
    text-transform: none;
  }
  .bottom .l em { font-style: italic; color: var(--ember); font-weight: 500; }
</style>
</head>
<body>
  <div class="story grain">
    <div class="grid-bg"></div>

    <div class="top">
      <span>/ 09 — Open for partners</span>
      <span>Story 09</span>
    </div>

    <div class="availability">
      <span class="dot-wrap"><span class="dot"></span></span>
      <span>Available · Lorem MMXXVI</span>
    </div>

    <div class="center">
      <div class="small">/09 — Let's build something</div>
      <h1>Lorem<br />ipsum <em>dolor.</em></h1>
      <p class="lede">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore.</p>
    </div>

    <div class="cta-stack">
      <span class="cta">Lorem ipsum
        <span class="a">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></svg>
        </span>
      </span>
      <span class="cta-2">devspark.studio</span>
    </div>

    <div class="bottom">
      <span class="l">DEV<em>SPARK</em></span>
      <span>09 / 10 · Contact</span>
    </div>
  </div>
</body>
</html>
