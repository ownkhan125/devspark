<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Devspark · Story 02 · Stat Tower</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0B0B10;
    --bone: #F4EFE6;
    --ember: #FF5A1F;
    --iris: #7C5CFF;
    --lime: #C7FF3D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #06060a; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Inter Tight", sans-serif;
    color: var(--ink);
    padding: 30px;
  }
  .story {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    border-radius: 8px;
    background:
      radial-gradient(80% 50% at 50% 10%, rgba(255,178,154,0.45), transparent 60%),
      linear-gradient(180deg, #FBF8F1 0%, #F4EFE6 40%, #E7DFD0 100%);
    box-shadow: 0 80px 200px -40px rgba(0,0,0,0.8);
  }
  .grain::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.06;
    mix-blend-mode: multiply;
    z-index: 50;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.9'/></svg>");
  }

  .ember-orb {
    position: absolute;
    right: -160px;
    top: 580px;
    width: 760px;
    height: 760px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 28%, #fff 0%, #ffd8c4 18%, #FF5A1F 60%, #7C2A05 100%);
    box-shadow:
      inset -80px -100px 160px rgba(0,0,0,0.45),
      inset 50px 60px 120px rgba(255,255,255,0.25),
      0 120px 200px rgba(255,90,31,0.5);
    z-index: 1;
  }
  .ember-orb::after {
    content: "";
    position: absolute;
    left: 20%; top: 14%;
    width: 30%; height: 22%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.55), transparent 60%);
    filter: blur(10px);
  }

  .top-bar {
    position: absolute;
    top: 110px;
    left: 100px;
    right: 100px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 16px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(11,11,16,0.7);
    z-index: 5;
  }

  .big-stat {
    position: absolute;
    top: 280px;
    left: 100px;
    right: 100px;
    z-index: 5;
  }
  .big-stat .mono {
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(11,11,16,0.5);
  }
  .big-stat .v {
    margin-top: 22px;
    font-weight: 500;
    font-size: 420px;
    line-height: 0.86;
    letter-spacing: -0.07em;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .big-stat .v .plus {
    color: var(--ember);
    font-size: 220px;
    margin-top: 30px;
    font-weight: 400;
  }

  .meta-row {
    position: absolute;
    top: 820px;
    left: 100px;
    right: 100px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    z-index: 5;
  }
  .meta-row .item {
    padding-top: 24px;
    border-top: 1px solid rgba(11,11,16,0.2);
  }
  .meta-row .label {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(11,11,16,0.45);
  }
  .meta-row .val {
    margin-top: 10px;
    font-weight: 500;
    font-size: 38px;
    letter-spacing: -0.03em;
    color: var(--ink);
  }
  .meta-row .val em { font-style: italic; color: var(--ember); font-weight: 400; }

  .quote-block {
    position: absolute;
    left: 100px;
    right: 100px;
    bottom: 280px;
    z-index: 5;
  }
  .quote-block .q {
    font-weight: 500;
    font-style: italic;
    font-size: 78px;
    line-height: 1.04;
    letter-spacing: -0.035em;
    color: var(--ink);
    text-wrap: balance;
  }
  .quote-block .q strong {
    color: var(--ember);
    font-weight: 500;
  }
  .quote-block .a {
    margin-top: 24px;
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(11,11,16,0.55);
  }

  .footer-bar {
    position: absolute;
    left: 100px;
    right: 100px;
    bottom: 110px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 30px;
    border-top: 2px solid var(--ink);
    z-index: 5;
  }
  .footer-bar .left {
    font-weight: 600;
    font-size: 34px;
    letter-spacing: -0.035em;
  }
  .footer-bar .left em { font-style: italic; color: var(--ember); font-weight: 500; }
  .footer-bar .right {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(11,11,16,0.55);
    text-align: right;
    line-height: 1.7;
  }
</style>
</head>
<body>
  <div class="story grain">
    <div class="ember-orb"></div>

    <div class="top-bar">
      <span>/ 02 — By the numbers</span>
      <span>Story 02</span>
    </div>

    <div class="big-stat">
      <div class="mono">/01 Lorem ipsum dolor sit amet consectetur</div>
      <div class="v">1800<span class="plus">+</span></div>
    </div>

    <div class="meta-row">
      <div class="item">
        <div class="label">/02 Lorem ipsum</div>
        <div class="val">1600<em>+ teams</em></div>
      </div>
      <div class="item">
        <div class="label">/03 Dolor sit amet</div>
        <div class="val">12<em>yr+ craft</em></div>
      </div>
    </div>

    <div class="quote-block">
      <p class="q">Lorem ipsum dolor sit amet, <strong>consectetur</strong> adipiscing elit sed do eiusmod tempor.</p>
      <div class="a">— Lorem ipsum · Dolor sit</div>
    </div>

    <div class="footer-bar">
      <span class="left">DEV<em>SPARK</em></span>
      <span class="right">devspark.studio<br />/ 02 of 10</span>
    </div>
  </div>
</body>
</html>
