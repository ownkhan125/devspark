<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Devspark · Feed 10 · Process Orbit</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0B0B10;
    --bone: #F4EFE6;
    --ember: #FF5A1F;
    --iris: #7C5CFF;
    --lime: #C7FF3D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #06060a; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Inter Tight", sans-serif;
    color: var(--bone);
    padding: 40px;
  }
  .post {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    border-radius: 8px;
    background:
      radial-gradient(80% 70% at 50% 40%, #1a1830 0%, #0b0a14 60%, #050509 100%);
    box-shadow: 0 80px 200px -40px rgba(0,0,0,0.8);
  }
  .grain::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.09;
    mix-blend-mode: overlay;
    z-index: 50;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.9'/></svg>");
  }

  .center-glow {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,92,255,0.50), transparent 65%);
    filter: blur(60px);
  }
  .center-glow-2 {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 240px;
    height: 240px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,90,31,0.65), transparent 65%);
    filter: blur(30px);
  }

  .top-bar {
    position: absolute;
    top: 64px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.55);
    z-index: 10;
  }

  .title {
    position: absolute;
    top: 118px;
    left: 64px;
    right: 64px;
    z-index: 10;
    text-align: center;
  }
  .title h2 {
    font-weight: 500;
    font-size: 64px;
    line-height: 0.98;
    letter-spacing: -0.04em;
  }
  .title h2 em {
    font-style: italic;
    font-weight: 400;
    color: var(--ember);
  }

  .orbit {
    position: absolute;
    left: 50%;
    top: 62%;
    width: 660px;
    height: 660px;
    transform: translate(-50%, -50%);
  }
  .orbit-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px dashed rgba(244,239,230,0.18);
  }
  .orbit-ring.inner {
    inset: 110px;
    border-style: solid;
    border-color: rgba(244,239,230,0.10);
  }
  .center-node {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: linear-gradient(160deg, rgba(244,239,230,0.16), rgba(244,239,230,0.04));
    border: 1px solid rgba(244,239,230,0.25);
    backdrop-filter: blur(14px);
    display: grid;
    place-items: center;
    text-align: center;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.25),
      0 30px 80px rgba(124,92,255,0.5),
      0 10px 30px rgba(255,90,31,0.3);
  }
  .center-node .mark {
    font-weight: 600;
    font-size: 38px;
    letter-spacing: -0.045em;
    line-height: 1;
  }
  .center-node .mark em { font-style: italic; color: var(--ember); }
  .center-node .sub {
    margin-top: 6px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.65);
  }

  .node {
    position: absolute;
    width: 200px;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .node .ball {
    width: 64px;
    height: 64px;
    margin: 0 auto;
    border-radius: 50%;
    border: 1px solid rgba(244,239,230,0.4);
    background: rgba(11,11,16,0.6);
    backdrop-filter: blur(8px);
    display: grid;
    place-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--bone);
    box-shadow: 0 0 0 6px rgba(244,239,230,0.06), 0 20px 40px rgba(0,0,0,0.4);
  }
  .node.n1 .ball { color: var(--ember); border-color: var(--ember); box-shadow: 0 0 0 6px rgba(255,90,31,0.18), 0 20px 40px rgba(255,90,31,0.35); }
  .node.n2 .ball { color: var(--iris); border-color: var(--iris); box-shadow: 0 0 0 6px rgba(124,92,255,0.18), 0 20px 40px rgba(124,92,255,0.35); }
  .node.n3 .ball { color: var(--lime); border-color: var(--lime); box-shadow: 0 0 0 6px rgba(199,255,61,0.18), 0 20px 40px rgba(199,255,61,0.35); }
  .node.n4 .ball { color: var(--bone); border-color: rgba(244,239,230,0.7); box-shadow: 0 0 0 6px rgba(244,239,230,0.10), 0 20px 40px rgba(244,239,230,0.18); }

  .node .label {
    margin-top: 14px;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: -0.02em;
  }
  .node .sub {
    margin-top: 6px;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.55);
  }

  .node.n1 { left: 50%; top: 0; }
  .node.n2 { left: 100%; top: 50%; }
  .node.n3 { left: 50%; top: 100%; }
  .node.n4 { left: 0; top: 50%; }

  .bottom-bar {
    position: absolute;
    bottom: 60px;
    left: 64px;
    right: 64px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.55);
  }
</style>
</head>
<body>
  <div class="post grain">
    <div class="center-glow"></div>
    <div class="center-glow-2"></div>

    <div class="top-bar">
      <span>/ 10 — One-week sprint</span>
      <span>Process · Lorem ipsum</span>
    </div>

    <div class="title">
      <h2>Four phases.<br /><em>One cycle.</em></h2>
    </div>

    <div class="orbit">
      <div class="orbit-ring"></div>
      <div class="orbit-ring inner"></div>

      <div class="center-node">
        <div>
          <div class="mark">DS<em>·</em></div>
          <div class="sub">Sprint 07</div>
        </div>
      </div>

      <div class="node n1">
        <div class="ball">01</div>
        <div class="label">Lorem</div>
        <div class="sub">Discover</div>
      </div>
      <div class="node n2">
        <div class="ball">02</div>
        <div class="label">Ipsum</div>
        <div class="sub">Design</div>
      </div>
      <div class="node n3">
        <div class="ball">03</div>
        <div class="label">Dolor</div>
        <div class="sub">Develop</div>
      </div>
      <div class="node n4">
        <div class="ball">04</div>
        <div class="label">Sit Amet</div>
        <div class="sub">Deploy</div>
      </div>
    </div>

    <div class="bottom-bar">
      <span>devspark.studio</span>
      <span>10 / 10 · Feed Series</span>
    </div>
  </div>
</body>
</html>
