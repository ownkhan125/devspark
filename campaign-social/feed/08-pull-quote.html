<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Devspark · Feed 08 · Pull Quote</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0B0B10;
    --bone: #F4EFE6;
    --ember: #FF5A1F;
    --iris: #7C5CFF;
    --lime: #C7FF3D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #06060a; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Inter Tight", sans-serif;
    color: var(--bone);
    padding: 40px;
  }
  .post {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    border-radius: 8px;
    background:
      radial-gradient(80% 60% at 80% 20%, rgba(124,92,255,0.30), transparent 60%),
      radial-gradient(60% 50% at 10% 90%, rgba(255,90,31,0.25), transparent 60%),
      linear-gradient(160deg, #0B0B10 0%, #13121B 60%, #0B0B10 100%);
    box-shadow: 0 80px 200px -40px rgba(0,0,0,0.8);
  }
  .grain::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.10;
    mix-blend-mode: overlay;
    z-index: 50;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.9'/></svg>");
  }

  .portrait {
    position: absolute;
    right: -180px;
    bottom: -80px;
    width: 480px;
    height: 620px;
    border-radius: 240px 240px 80px 80px;
    background:
      radial-gradient(60% 50% at 50% 28%, #ffc2a8 0%, #FF5A1F 50%, #7C2A05 100%);
    box-shadow:
      inset -40px -60px 100px rgba(0,0,0,0.55),
      inset 30px 40px 80px rgba(255,255,255,0.18),
      0 80px 120px rgba(255,90,31,0.45);
    transform: rotate(-2deg);
  }
  .portrait::before {
    content: "";
    position: absolute;
    left: 28%;
    top: 12%;
    width: 30%;
    height: 18%;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.40), transparent 65%);
    filter: blur(12px);
  }
  .portrait::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, transparent 50%, rgba(11,11,16,0.5) 100%);
    border-radius: inherit;
  }

  .frame-line {
    position: absolute;
    inset: 56px;
    border: 1px solid rgba(244,239,230,0.08);
    border-radius: 4px;
    pointer-events: none;
  }

  .top-bar {
    position: absolute;
    top: 80px;
    left: 80px;
    right: 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.55);
    z-index: 5;
  }

  .open-quote {
    position: absolute;
    left: 64px;
    top: 140px;
    font-family: "Inter Tight", sans-serif;
    font-weight: 500;
    font-style: italic;
    font-size: 480px;
    line-height: 1;
    color: rgba(255,90,31,0.18);
    letter-spacing: -0.08em;
    z-index: 2;
    user-select: none;
  }

  .quote {
    position: absolute;
    left: 80px;
    top: 360px;
    max-width: 620px;
    font-weight: 500;
    font-size: 68px;
    line-height: 1.06;
    letter-spacing: -0.03em;
    z-index: 5;
    text-wrap: balance;
    text-shadow: 0 4px 24px rgba(11,11,16,0.65);
  }
  .quote em {
    font-style: italic;
    font-weight: 400;
    color: var(--ember);
  }

  .attribution {
    position: absolute;
    left: 80px;
    bottom: 110px;
    display: flex;
    align-items: center;
    gap: 16px;
    z-index: 5;
  }
  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 35%, #d9c4ff, #7C5CFF 50%, #2B1F70 100%);
    box-shadow: inset -10px -14px 30px rgba(0,0,0,0.5), inset 8px 10px 20px rgba(255,255,255,0.2);
    border: 2px solid rgba(244,239,230,0.25);
  }
  .attribution .name {
    font-weight: 500;
    font-size: 18px;
    letter-spacing: -0.02em;
  }
  .attribution .role {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.5);
    margin-top: 2px;
  }

  .index {
    position: absolute;
    right: 80px;
    bottom: 100px;
    text-align: right;
    z-index: 5;
  }
  .index .big {
    font-family: "Inter Tight", sans-serif;
    font-weight: 500;
    font-size: 84px;
    line-height: 0.9;
    letter-spacing: -0.05em;
  }
  .index .big em { font-style: italic; color: var(--ember); }
  .index .small {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.55);
    margin-top: 6px;
  }
</style>
</head>
<body>
  <div class="post grain">
    <div class="portrait"></div>
    <div class="frame-line"></div>

    <div class="open-quote">"</div>

    <div class="top-bar">
      <span>/ 08 — Voices</span>
      <span>Lorem · MMXXVI · Vol.01</span>
    </div>

    <p class="quote">Lorem ipsum dolor sit amet, <em>consectetur adipiscing</em> elit sed eiusmod tempor.</p>

    <div class="attribution">
      <div class="avatar"></div>
      <div>
        <div class="name">Lorem Ipsum</div>
        <div class="role">Dolor Sit Amet · @consectetur</div>
      </div>
    </div>

    <div class="index">
      <div class="big">08<em>/10</em></div>
      <div class="small">Testimonial</div>
    </div>
  </div>
</body>
</html>
