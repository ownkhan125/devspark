<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Devspark · Story 04 · Ember Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #0B0B10;
    --bone: #F4EFE6;
    --ember: #FF5A1F;
    --iris: #7C5CFF;
    --lime: #C7FF3D;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #06060a; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    font-family: "Inter Tight", sans-serif;
    color: var(--bone);
    padding: 30px;
  }
  .story {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    border-radius: 8px;
    background:
      radial-gradient(60% 30% at 30% 20%, rgba(255,178,154,0.85), transparent 60%),
      radial-gradient(60% 40% at 80% 80%, rgba(124,92,255,0.55), transparent 60%),
      linear-gradient(170deg, #FF5A1F 0%, #E84A12 50%, #7C2A05 100%);
    box-shadow: 0 80px 200px -40px rgba(0,0,0,0.8);
  }
  .grain::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.12;
    mix-blend-mode: overlay;
    z-index: 50;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.9'/></svg>");
  }

  /* Floating 3D shapes */
  .shape {
    position: absolute;
    border-radius: 50%;
  }
  .shape.s1 {
    width: 280px; height: 280px;
    left: -60px; top: 380px;
    background: radial-gradient(circle at 30% 30%, #fff, #C7FF3D 50%, #6B8C1A 100%);
    box-shadow:
      inset -30px -40px 60px rgba(0,0,0,0.45),
      inset 18px 24px 50px rgba(255,255,255,0.4),
      0 50px 80px rgba(199,255,61,0.4);
  }
  .shape.s2 {
    width: 340px; height: 340px;
    right: -80px; top: 1180px;
    background: radial-gradient(circle at 30% 30%, #fff, #d9c4ff 30%, #7C5CFF 70%, #2B1F70 100%);
    box-shadow:
      inset -40px -50px 80px rgba(0,0,0,0.5),
      inset 22px 30px 60px rgba(255,255,255,0.4),
      0 60px 100px rgba(124,92,255,0.55);
  }
  .shape.s3 {
    width: 180px; height: 180px;
    left: 720px; top: 420px;
    background: radial-gradient(circle at 30% 30%, #fff, #F4EFE6 30%, #C9C0AE 60%, #4d4636 100%);
    box-shadow:
      inset -20px -30px 50px rgba(0,0,0,0.45),
      inset 14px 20px 40px rgba(255,255,255,0.45),
      0 40px 70px rgba(0,0,0,0.4);
  }
  .cube-3d {
    position: absolute;
    left: 80px;
    top: 1320px;
    width: 160px;
    height: 160px;
    perspective: 800px;
    z-index: 3;
  }
  .cube-3d .c {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transform: rotateX(-22deg) rotateY(36deg);
  }
  .cube-3d .c .f {
    position: absolute;
    inset: 0;
    background: rgba(11,11,16,0.7);
    border: 1.5px solid rgba(244,239,230,0.7);
  }
  .cube-3d .c .f.fr { transform: translateZ(80px); background: rgba(11,11,16,0.85); }
  .cube-3d .c .f.bk { transform: translateZ(-80px); }
  .cube-3d .c .f.rt { transform: rotateY(90deg) translateZ(80px); background: rgba(11,11,16,0.6); }
  .cube-3d .c .f.lt { transform: rotateY(-90deg) translateZ(80px); background: rgba(11,11,16,0.6); }
  .cube-3d .c .f.tp { transform: rotateX(90deg) translateZ(80px); background: rgba(244,239,230,0.18); }
  .cube-3d .c .f.bt { transform: rotateX(-80deg) translateZ(80px); }

  .top {
    position: absolute;
    top: 110px;
    left: 100px;
    right: 100px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 16px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(244,239,230,0.85);
    z-index: 10;
  }

  .hero {
    position: absolute;
    left: 100px;
    right: 100px;
    top: 720px;
    text-align: center;
    z-index: 9;
    isolation: isolate;
  }
  .hero h1 {
    font-weight: 600;
    font-size: 220px;
    line-height: 0.88;
    letter-spacing: -0.06em;
    color: var(--bone);
    text-shadow:
      0 6px 0 rgba(11,11,16,0.20),
      0 30px 80px rgba(11,11,16,0.45);
  }
  .hero h1 em {
    font-style: italic;
    font-weight: 400;
    color: var(--ink);
    -webkit-text-stroke: 2px var(--bone);
  }

  .hero .sub {
    margin-top: 28px;
    font-weight: 500;
    font-style: italic;
    font-size: 44px;
    color: var(--ink);
    letter-spacing: -0.025em;
    line-height: 1.1;
  }

  .badge {
    position: absolute;
    left: 50%;
    top: 540px;
    transform: translateX(-50%);
    z-index: 9;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 16px 28px;
    background: var(--ink);
    color: var(--bone);
    border-radius: 999px;
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    box-shadow: 0 30px 60px rgba(11,11,16,0.45);
  }
  .badge .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 14px var(--lime); }

  .bottom {
    position: absolute;
    left: 100px;
    right: 100px;
    bottom: 110px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 30px;
    border-top: 2px solid var(--ink);
    z-index: 10;
  }
  .bottom .l {
    color: var(--ink);
    font-weight: 600;
    font-size: 38px;
    letter-spacing: -0.035em;
  }
  .bottom .l em { font-style: italic; color: var(--bone); font-weight: 500; }
  .bottom .r {
    color: var(--ink);
    text-align: right;
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    line-height: 1.7;
  }
</style>
</head>
<body>
  <div class="story grain">
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="cube-3d">
      <div class="c">
        <div class="f bk"></div>
        <div class="f lt"></div>
        <div class="f rt"></div>
        <div class="f tp"></div>
        <div class="f bt"></div>
        <div class="f fr"></div>
      </div>
    </div>

    <div class="top">
      <span>/ 04 — Manifesto poster</span>
      <span>Story 04</span>
    </div>

    <div class="badge"><span class="dot"></span>Lorem ipsum · MMXXVI</div>

    <div class="hero">
      <h1>Lorem<br /><em>ipsum.</em></h1>
      <div class="sub">Dolor sit amet, consectetur.</div>
    </div>

    <div class="bottom">
      <div class="l">DEV<em>SPARK</em></div>
      <div class="r">devspark.studio<br />/ 04 of 10</div>
    </div>
  </div>
</body>
</html>
